# Atencao: o cron do GitHub e desativado apos 60 dias sem commits no repositorio.
name: Manter Supabase acordado

on:
  schedule:
    - cron: '17 12 * * 1,3,5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a RPC ping para gerar atividade no Postgres
        env:
          SUPABASE_URL: https://kkrwclwjdrradypfuflh.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_6-d0AXgLmZ0uTpiXMSgtIw_EV8Xq_kl' }}
        run: |
          codigo=$(curl --fail --silent --show-error --location \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$SUPABASE_URL/rest/v1/rpc/ping")
          echo "Resposta do Supabase: $codigo"
          test "$codigo" = "200"
